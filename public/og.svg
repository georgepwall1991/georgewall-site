<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f0e6"/>

  <!-- hairline frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#18140d" stroke-width="2"/>

  <!-- masthead row -->
  <line x1="64" y1="118" x2="1136" y2="118" stroke="#dbd4c3" stroke-width="1"/>
  <text x="64" y="100" font-family="'JetBrains Mono','SF Mono',monospace" font-size="22" letter-spacing="3" fill="#8c8472">№ 01</text>
  <text x="1136" y="100" text-anchor="end" font-family="'JetBrains Mono','SF Mono',monospace" font-size="22" letter-spacing="3" fill="#8c8472">LONDON · MMXXVI</text>

  <!-- kicker -->
  <text x="64" y="210" font-family="'JetBrains Mono','SF Mono',monospace" font-size="24" letter-spacing="5" fill="#e12d0b">FULL-STACK DEVELOPER · FINANCIAL SERVICES</text>

  <!-- headline -->
  <text x="60" y="330" font-family="Georgia,'Times New Roman',serif" font-weight="600" font-size="132" fill="#18140d">Catching <tspan font-style="italic">bugs</tspan></text>
  <!-- squiggle under "bugs" -->
  <path d="M700 352 q18 -18 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0" fill="none" stroke="#e12d0b" stroke-width="8" stroke-linecap="round"/>
  <text x="60" y="462" font-family="Georgia,'Times New Roman',serif" font-weight="600" font-size="132" fill="#18140d">before they ship.</text>

  <!-- footer -->
  <line x1="64" y1="520" x2="1136" y2="520" stroke="#dbd4c3" stroke-width="1"/>
  <text x="64" y="560" font-family="Georgia,serif" font-weight="600" font-size="30" fill="#18140d">George Wall</text>
  <text x="1136" y="560" text-anchor="end" font-family="'JetBrains Mono','SF Mono',monospace" font-size="24" letter-spacing="2" fill="#8c8472">georgewall.uk</text>
