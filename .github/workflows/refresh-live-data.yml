# Rebuilds production once a day so build-time data (NuGet download counts,
# GitHub stars) stays current without a code change.
#
# Setup: create a Deploy Hook in Vercel (Project → Settings → Git → Deploy
# Hooks, branch `main`) and save its URL as the repository secret
# VERCEL_DEPLOY_HOOK_URL.
name: Refresh live data

on:
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC daily
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel production build
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL secret is not set. See the comment at the top of this workflow."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 -X POST "$HOOK"
