# Refreshes the committed NuGet snapshot once a day. When the counts change,
# the commit to main triggers Vercel's normal production deploy, which also
# re-fetches live NuGet and GitHub data at build time. No secrets needed.
name: Refresh live data

on:
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch latest NuGet counts
        run: node scripts/refresh-nuget.mjs
      - name: Commit if anything changed
        run: |
          # generatedAt always moves, so only commit when a package entry changed.
          if git diff --quiet -I '"generatedAt"' -- src/data/nuget-snapshot.json; then
            echo "NuGet counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/nuget-snapshot.json
          git commit -m "Refresh NuGet download counts"
          git push origin HEAD:main
